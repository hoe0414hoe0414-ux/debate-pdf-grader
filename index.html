<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토론 PDF 채점 판독기</title>
<meta name="description" content="학생 토론 수행평가 PDF를 읽고 채점 기준에 맞춰 채점하는 도구 (데모)">
<meta name="theme-color" content="#16213A">
<link rel="icon" href="assets/favicon.ico?v=2" sizes="any">
<link rel="icon" href="assets/icon-192.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=7">
<script type="module" src="app.js?v=7"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">토론 PDF</div>
      <div class="brand-sub">채점 판독기</div>
    </div>
    <nav class="nav" aria-label="메뉴">
      <a class="nav-item" href="#settings" data-view="settings">
        <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.6"/><path d="M9 1.8v2.1M9 14.1v2.1M1.8 9h2.1M14.1 9h2.1M3.9 3.9l1.5 1.5M12.6 12.6l1.5 1.5M3.9 14.1l1.5-1.5M12.6 5.4l1.5-1.5"/></svg>
        <span>설정</span>
      </a>
      <a class="nav-item" href="#files" data-view="files">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2h6.5L14 5.5V16H4z"/><path d="M10.5 2v3.5H14"/></svg>
        <span>업로드 파일</span><b class="nav-badge" id="badge-files" hidden></b>
      </a>
      <a class="nav-item" href="#results" data-view="results">
        <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="2"/><path d="M2 7h14M7 7v9"/></svg>
        <span>채점 결과</span><b class="nav-badge" id="badge-results" hidden></b>
      </a>
    </nav>
    <div class="sidebar-foot">데모 버전 · v0.1</div>
  </aside>

  <main class="main">
    <!-- 설정 -->
    <section class="view" id="view-settings" data-view="settings" hidden>
      <header class="page-head compact">
        <h1>채점 설정</h1>
        <div class="id-row" role="radiogroup" aria-label="학번 자릿수">
          <span class="id-label" title="학년 1자리 + 반 + 번호 2자리">학번 자릿수</span>
          <label class="option sm"><input type="radio" name="idDigits" value="4"><span>4자리 <small>(2301)</small></span></label>
          <label class="option sm"><input type="radio" name="idDigits" value="5"><span>5자리 <small>(20301)</small></span></label>
          <span class="io-sep" aria-hidden="true"></span>
          <button class="btn small" id="settings-export" type="button" title="모든 평가 영역과 설정을 파일로 저장">설정 내보내기</button>
          <button class="btn small" id="settings-import" type="button" title="내보낸 설정 파일을 불러오기">설정 불러오기</button>
          <input type="file" id="settings-file" accept=".json,application/json" hidden>
        </div>
      </header>
      <div class="notice import-notice" id="import-notice" hidden></div>

      <div class="card section-card">
        <div class="card-head">
          <h2>평가 영역별 채점 기준</h2>
          <span class="save-state" id="criteria-state"></span>
        </div>
        <div class="sec-tabs" id="sec-tabs" role="tablist" aria-label="평가 영역"></div>

        <div class="sec-body">
          <div class="sec-main">
            <h3>채점 기준</h3>
            <textarea id="criteria" class="textarea" rows="18" spellcheck="false" placeholder="## 평가 : 찬반 토론 입론서 작성&#10;&#10;## 토론 주제&#10;…&#10;&#10;1. 사회 문제 탐색 : 30점 만점&#10;학생이 주장하는 바가 명확하고 주제에 맞는가"></textarea>
            <div class="validation" id="criteria-validation" aria-live="polite"></div>
            <div class="actions">
              <button class="btn primary" id="criteria-save" type="button">기준 저장</button>
              <button class="btn" id="criteria-revert" type="button">저장된 기준으로 되돌리기</button>
              <button class="btn ghost" id="criteria-example" type="button">예시 불러오기</button>
            </div>
          </div>

          <div class="sec-side">
            <div class="sub">
              <h3>영역 이름</h3>
              <div class="sec-name-row">
                <input id="sec-name" class="input" maxlength="30" placeholder="예: 입론서 (1학기)" aria-label="영역 이름">
                <button class="btn ghost danger-text small" id="sec-delete" type="button">이 영역 삭제</button>
              </div>
            </div>

            <div class="sub">
              <h3>양면 / 단면</h3>
              <div class="options" role="radiogroup" aria-label="양면/단면 기본값">
                <label class="option sm"><input type="radio" name="layoutDefault" value="auto"><span>자동 판단</span></label>
                <label class="option sm"><input type="radio" name="layoutDefault" value="duplex"><span>모두 양면 <small>(2쪽=1명)</small></span></label>
                <label class="option sm"><input type="radio" name="layoutDefault" value="simplex"><span>모두 단면 <small>(1쪽=1명)</small></span></label>
              </div>
            </div>

            <div class="sub grow">
              <h3>판독 참고 사항 <small class="muted">(선택)</small></h3>
              <textarea id="reading-notes" class="textarea" rows="5" placeholder="예: 첫 장은 표지이므로 제외하고, 주장·근거·반론 칸만 읽어 주세요."></textarea>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 업로드 파일 -->
    <section class="view" id="view-files" data-view="files" hidden>
      <header class="page-head">
        <h1>업로드 파일</h1>
        
      </header>

      <div class="sec-tabs" id="files-sec-tabs" role="tablist" aria-label="평가 영역"></div>

      <div class="files-grid">
        <div class="files-left">
          <label class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="PDF 파일 선택 또는 끌어다 놓기">
            <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 27V11M13 18l7-7 7 7"/><path d="M8 26v5h24v-5"/></svg>
            <strong id="dz-title">PDF 파일을 여기로 끌어다 놓으세요</strong>
            <span class="muted">또는 클릭해서 선택 · 여러 파일 가능 · 파일은 이 컴퓨터 밖으로 전송되지 않아요</span>
          </label>
          <div class="notice warn" id="files-notice" hidden></div>
        </div>

        <div class="files-right">
          <div class="toolbar">
            <span class="muted" id="files-summary">아직 올린 파일이 없어요.</span>
            <div class="toolbar-actions">
              <button class="btn small" id="regrade-all" type="button" hidden>전체 다시 채점</button>
              <button class="btn small ghost danger-text" id="clear-all" type="button" hidden>전체 삭제</button>
            </div>
          </div>
          <ul class="file-list" id="file-list"></ul>
          <div class="list-empty muted" id="list-empty">올린 파일이 여기에 나타나요.</div>
        </div>
      </div>
    </section>

    <!-- 채점 결과 -->
    <section class="view" id="view-results" data-view="results" hidden>
      <header class="page-head">
        <h1>채점 결과</h1>
        <p>영역 이름을 누르면 학급을 골라 그 학급 학생들의 점수표를 볼 수 있어요.</p>
      </header>
      <div class="notice warn" id="results-notice" hidden></div>
      <div class="tabs-row">
        <div class="tabs" id="result-tabs" role="tablist"></div>
        <button class="btn" id="export-csv" type="button" hidden>엑셀(CSV) 내려받기</button>
      </div>
      <div id="result-body"></div>
      <div class="menu" id="tab-menu" role="menu" hidden></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
